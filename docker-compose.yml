services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: itam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: itam
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itam -d itam"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://itam:${POSTGRES_PASSWORD}@db:5432/itam?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      SESSION_MAX_AGE_DAYS: ${SESSION_MAX_AGE_DAYS:-7}
      APP_URL: ${APP_URL:-http://localhost:3000}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-vi}
      # Runs once on first boot (safe to leave true - re-seeding an existing
      # database only upserts the admin/category rows, it does not wipe data).
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_DEMO: ${SEED_DEMO:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@company.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD in .env}
    # Behind Cloudflare Tunnel set APP_BIND=127.0.0.1 so the app is reachable
    # only through the tunnel and nothing is exposed on the public interface.
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000"

  # Optional: publishes the app through a Cloudflare Tunnel, so the VPS needs no
  # inbound port open and Cloudflare terminates TLS. Create the tunnel in the
  # Cloudflare dashboard (Zero Trust > Networks > Tunnels), point its public
  # hostname at http://app:3000, put the token in .env, then:
  #
  #   docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      # Not `:?` - compose interpolates every service even when its profile is
      # inactive, so a required marker here would break the plain `up -d` path.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - app

volumes:
  pgdata:
