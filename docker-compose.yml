services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: itam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: itam
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itam -d itam"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://itam:${POSTGRES_PASSWORD}@db:5432/itam?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      SESSION_MAX_AGE_DAYS: ${SESSION_MAX_AGE_DAYS:-7}
      APP_URL: ${APP_URL:-http://localhost:3000}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-vi}
      # Runs once on first boot (safe to leave true - re-seeding an existing
      # database only upserts the admin/category rows, it does not wipe data).
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_DEMO: ${SEED_DEMO:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@company.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD in .env}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  pgdata:
